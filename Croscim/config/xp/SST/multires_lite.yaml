# @package _global_
# Configuration LITE pour test rapide du pipeline d'entraînement

paths:
  src: /dmidata/users/malegu/4D-MLG/Croscim
  preproc: /dmidata/users/malegu/data/preproc_SST

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  accumulate_grad_batches: 2
  limit_train_batches: 10
  limit_val_batches: 5
  max_epochs: 3 
  precision: 32
  enable_progress_bar: true
  enable_model_summary: true
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: logs
    name: sst_multires_lite
    version: ''
    default_hp_metric: false
  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      save_top_k: 1
      filename: '{val_loss:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.SST.data_multires.BaseDataModuleMultiRes
  sst_daily_paths: /home/malegu/4D-MLG/Croscim/data/mounted
  covariates_paths: []
  multires: [10, 3, 1]
  precomputed: True
  mask_path: null
  domain_name: sst_multires
  res: 5.0
  pads: [False, False, False]
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2024-01-01', '2024-01-31']}  # Seulement janvier 2024
    val:
      time: {_target_: builtins.slice, _args_: ['2024-02-01', '2024-02-15']}  # 15 jours de validation
    test:
      time: {_target_: builtins.slice, _args_: ['2024-02-16', '2024-02-29']}  # Reste de février
  xrds_kw:
    patch_dims: {time: 15, lat: 256, lon: 256}
    strides: {time: 3, lat: 64, lon: 64}
  dl_kw:
    batch_size: 4
    num_workers: 24
    persistent_workers: true
    prefetch_factor: 2
  tgt_vars: ["slstr_av", "aasti_av"]
  norm_stats:
    aasti:
      av: {mean: -7.228, std: 13.843, type: zscore}
      std: {mean: 0.479, std: 0.433, type: zscore}
    avhrr:
      av: {mean: 20.309, std: 8.798, type: zscore}
      std: {mean: 0.107, std: 0.072, type: zscore}
    pmw:
      av: {mean: 18.158, std: 9.656, type: zscore}
      std: {mean: 0.096, std: 0.064, type: zscore}
    slstr:
      av: {mean: 20.406, std: 9.136, type: zscore}
      std: {mean: 0.139, std: 0.129, type: zscore}
    tgt_sst: {mean: 11.683, std: 17.667, type: zscore}
  norm_stats_covs:
    sea_ice_fraction: {min: 0.0, max: 1.0, type: minmax}

model:
  _target_: contrib.SST.models.Lit4dVarNet_SST
  persist_rw: False
  multires: [10, 3, 1]
  opt_fn: null
  tgt_vars: ["tgt_sst"]
  norm_tgt_vars: ["slstr_av", "aasti_av"]
  domain_limits: null
  rec_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  optim_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  prior_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  frcst_lead: 0
  solver:
    _target_: contrib.SST.solver.GradSolvers
    solvers:
      solver_x1:
        _target_: contrib.SST.solver.GradSolver
        n_step: 3  # RÉDUIT : seulement 3 steps (au lieu de 20)
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 49       # Input: 4 satellites×2×5T + covariate×5T + 4 spatial = 40+5+4=49
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 96
          dim_out: 5       # Output: SST on 5 days (after DAW crop 15→9→5)
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 5        # State = SST (5 channels after crop)
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 128
      solver_x3:
        _target_: contrib.SST.solver.GradSolver
        n_step: 3  # RÉDUIT : 3 au lieu de 15
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 85       # Input: 4 satellites×2×9T + covariate×9T + 4 spatial = 72+9+4=85
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 80
          dim_out: 9       # Output: SST on 9 days (after DAW crop 15=>9)
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 9        # State = SST (9 channels after crop)
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 96
      solver_x10:
        _target_: contrib.SST.solver.GradSolver
        n_step: 2  # RÉDUIT : 2 au lieu de 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 139      # Input: 4 satellites×2×15T + covariate×15T + 4 spatial = 120+15+4=139
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 64
          dim_out: 15      # Output: SST on 15 days (full window)
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 15       # State = SST (15 channels full window)
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 80
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  _target_: src.utils.get_linear_time_wei
  patch_dims: {time: 15, lat: 256, lon: 256}
  crop: {time: 0, lat: 28, lon: 28}
  offset: 1
  dim_order: ["time", "lat", "lon"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: /dmidata/users/malegu/results
