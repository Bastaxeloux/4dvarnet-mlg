# @package _global_
# Configuration LITE pour test rapide du pipeline d'entraînement
paths:
  src: /dmidata/users/malegu/4D-MLG/Croscim
  preproc: /dmidata/users/malegu/data/preproc_SST
  outputs: /dmidata/projects/4dvarnet/outputs

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  accumulate_grad_batches: 5
  limit_train_batches: 20
  limit_val_batches: 16  # ceil((n_viz=16 + n_loss=48) / batch_size=4)
  max_epochs: 3
  precision: 32
  enable_progress_bar: true
  enable_model_summary: true
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: /dmidata/projects/4dvarnet/results_sst_multires
    name: run
    version: ${now:%Y%m%d_%H%M%S}  # Format: 20251119_153042
    default_hp_metric: false
  callbacks:
    # - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: /dmidata/projects/4dvarnet/checkpoints_sst_multires
      monitor: val/loss
      save_top_k: 3  # Garde les 3 meilleurs modèles
      save_last: true  # Sauvegarde aussi le dernier checkpoint
      filename: '{epoch:03d}-{val/loss:.5f}'
      mode: min

datamodule:
  _target_: contrib.SST.data_multires.BaseDataModuleMultiRes
  sst_daily_paths: /nwp/sst_malegu
  covariates_paths: []
  multires: [10, 3, 1]
  precomputed : True
  mask_path: null
  domain_name: sst_multires
  res: 5.0
  pads: [False, False, False]
  # Set de validation figé : 16 viz + 48 loss (cf multires.yaml).
  val_set_dir: ${paths.outputs}/val_set
  n_viz: 16
  n_loss: 48
  rebuild_val_set: false
  val_set_seed: 42
  val_set_max_scan: 2000
  val_candidate_budget: 200
  val_set_num_workers: 0
  patch_filter:
    train:    {min_valid_ratio: 0.02, min_variance: 0.05, min_ocean_ratio: 0.05}
    val_viz:  {min_valid_ratio: 0.50, min_variance: 0.30, min_ocean_ratio: 0.50}
    val_loss: {min_valid_ratio: 0.02, min_variance: 0.05, min_ocean_ratio: 0.05}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2024-01-01', '2024-08-31']}  # 8 mois
    val:
      time: {_target_: builtins.slice, _args_: ['2024-09-01', '2024-10-31']}  # 2 mois (61 jours)
    test:
      time: {_target_: builtins.slice, _args_: ['2024-11-01', '2024-12-31']}  # 2 mois 
  xrds_kw:
    patch_dims: {time: 15, lat: 256, lon: 256}
    strides: {time: 3, lat: 64, lon: 64}
    test_single_day: true  # NEW: Test sur une seule journée aléatoire dans la plage
    test_date_idx: 15 # Index du jour cible dans la plage de test (15e jour de Decembre 2024), il faudra changer ca plus tard !
  dl_kw:
    batch_size: 4
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  tgt_vars: ["slstr_av", "aasti_av"]
  norm_stats:
    aasti:
      av: {mean: 12.114575386047363, std: 18.48964500427246, type: zscore}
      std: {mean: 0.4696625769138336, std: 0.4182772636413574, type: zscore}
    avhrr:
      av: {mean: 12.114575386047363, std: 18.48964500427246, type: zscore}
      std: {mean: 0.10309483110904694, std: 0.07243569195270538, type: zscore}
    pmw:
      av: {mean: 12.114575386047363, std: 18.48964500427246, type: zscore}
      std: {mean: 0.09620385617017746, std: 0.06406598538160324, type: zscore}
    slstr:
      av: {mean: 12.114575386047363, std: 18.48964500427246, type: zscore}
      std: {mean: 0.14114639163017273, std: 0.13175466656684875, type: zscore}
    tgt_sst: {mean: 12.114575386047363, std: 18.48964500427246, type: zscore}
  norm_stats_covs:
    sea_ice_fraction: {min: 0.0, max: 1.0, type: minmax}

model:
  _target_: contrib.SST.models.Lit4dVarNet_SST
  outputs_dir: ${paths.outputs}
  persist_rw: False
  multires: [10, 3, 1]
  opt_fn: null
  tgt_vars: ["tgt_sst"]
  norm_tgt_vars: ["slstr_av", "aasti_av"]
  domain_limits: null
  rec_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  optim_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  prior_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  frcst_lead: 0
  loss_weights:
    mse: 1.0      # Erreur prédiction vs observations
    grad: 0.001   # Erreur sur gradients Sobel (discontinuités)
    prior: 0.05   # Erreur target vs BilinReconstructor (régularisation)
  inpaint_weight_factor: 1.0  # Boost pour pixels masqués artificiellement
  solver:
    _target_: contrib.SST.solver.GradSolvers
    solvers:
      solver_x1:
        _target_: contrib.SST.solver.GradSolver
        n_step: 3  # RÉDUIT : seulement 3 steps (au lieu de 20)
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.model_components.priors.bilinear.BilinReconstructorPriorCost
          dim_in: 44       # Input: fusion×5T + slstr_std×5T + aasti_std×5T + avhrr×2×5T + pmw×2×5T + cov×5T + 4 spatial = 5+5+5+10+10+5+4=44
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 96
          dim_out: 5       # Output: SST on 5 days (after DAW crop 15→9→5)
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: contrib.SST.model_components.grad_mods.convlstm.ConvLstmGradModel
          dim_in: 5        # State = SST (5 channels after crop)
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 128
      solver_x3:
        _target_: contrib.SST.solver.GradSolver
        n_step: 3  # RÉDUIT : 3 au lieu de 15
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.model_components.priors.bilinear.BilinReconstructorPriorCost
          dim_in: 76       # Input: fusion×9T + slstr_std×9T + aasti_std×9T + avhrr×2×9T + pmw×2×9T + cov×9T + 4 spatial = 9+9+9+18+18+9+4=76
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 80
          dim_out: 9       # Output: SST on 9 days (after DAW crop 15=>9)
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: contrib.SST.model_components.grad_mods.convlstm.ConvLstmGradModel
          dim_in: 9        # State = SST (9 channels after crop)
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 96
      solver_x10:
        _target_: contrib.SST.solver.GradSolver
        n_step: 2  # RÉDUIT : 2 au lieu de 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.model_components.priors.bilinear.BilinReconstructorPriorCost
          dim_in: 124      # Input: fusion×15T + slstr_std×15T + aasti_std×15T + avhrr×2×15T + pmw×2×15T + cov×15T + 4 spatial = 15+15+15+30+30+15+4=124
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 64
          dim_out: 15      # Output: SST on 15 days (full window)
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: contrib.SST.model_components.grad_mods.convlstm.ConvLstmGradModel
          dim_in: 15       # State = SST (15 channels full window)
          dim_hidden: 32   # RÉDUIT : 32 au lieu de 80
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  _target_: src.utils.get_linear_time_wei
  patch_dims: {time: 15, lat: 256, lon: 256}
  crop: {time: 0, lat: 28, lon: 28}
  offset: 1
  dim_order: ["time", "lat", "lon"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: /dmidata/projects/4dvarnet/results_sst_multires
