# @package _global_
# Configuration pour Gefion avec 1 SEUL GPU H100 (expérimentations)
# Optimisé pour throughput maximal sur 1 GPU

paths:
  src: /dcai/projects/cu_0026/Croscim
  preproc: null
  outputs: /dcai/projects/cu_0026/outputs

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1 
  accumulate_grad_batches: 2 
  limit_train_batches: 200    # 200 batches par epoch
  limit_val_batches: 4
  max_epochs: 96 
  precision: bf16-mixed       # bfloat16 mixed precision - optimal pour H100
  enable_progress_bar: true
  enable_model_summary: true
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: /dcai/projects/cu_0026/results
    name: run
    version: ${now:%Y%m%d_%H%M%S}
    default_hp_metric: false
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: /dcai/projects/cu_0026/checkpoints
      monitor: val/loss
      save_top_k: 3
      save_last: true
      filename: '{epoch:03d}-{val/loss:.5f}'
      mode: min

datamodule:
  _target_: contrib.SST.data_multires.BaseDataModuleMultiRes
  sst_daily_paths: /dcai/projects/cu_0026/data_sst
  covariates_paths: []
  multires: [10, 3, 1]
  precomputed: True
  mask_path: null
  domain_name: sst_multires
  res: 5.0
  pads: [False, False, False]
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2023-01-01', '2024-09-30']}
    val:
      time: {_target_: builtins.slice, _args_: ['2024-10-01', '2024-11-30']}
    test:
      time: {_target_: builtins.slice, _args_: ['2024-12-01', '2024-12-31']}
  xrds_kw:
    patch_dims: {time: 15, lat: 256, lon: 256}
    strides: {time: 7, lat: 40, lon: 40}
    test_single_day: true
    test_date_idx: 15
  dl_kw:
    batch_size: 6
    num_workers: 28
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  tgt_vars: ["slstr_av", "aasti_av"]
  norm_stats:
    aasti:
      av: {mean: -6.545, std: 13.540, type: zscore}
      std: {mean: 0.472, std: 0.418, type: zscore}
    avhrr:
      av: {mean: 20.125, std: 8.844, type: zscore}
      std: {mean: 0.101, std: 0.070, type: zscore}
    pmw:
      av: {mean: 16.348, std: 10.603, type: zscore}
      std: {mean: 0.096, std: 0.064, type: zscore}
    slstr:
      av: {mean: 20.338, std: 9.139, type: zscore}
      std: {mean: 0.136, std: 0.128, type: zscore}
    tgt_sst: {mean: 10.760, std: 17.636, type: zscore}
  norm_stats_covs:
    sea_ice_fraction: {min: 0.0, max: 1.0, type: minmax}

model:
  _target_: contrib.SST.models.Lit4dVarNet_SST
  outputs_dir: ${paths.outputs}
  persist_rw: False
  multires: [10, 3, 1]
  opt_fn: null
  tgt_vars: ["tgt_sst"]
  norm_tgt_vars: ["slstr_av", "aasti_av"]
  domain_limits: null
  rec_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  optim_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  prior_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  frcst_lead: 0
  loss_weights:
    mse: 1.0      # Erreur prédiction vs observations
    grad: 0.001   # Erreur sur gradients Sobel (discontinuités)
    prior: 0.05   # Erreur target vs BilinReconstructor (régularisation)
  inpaint_weight_factor: 3.0  # Boost pour pixels masqués artificiellement
  solver:
    _target_: contrib.SST.solver.GradSolvers
    solvers:
      solver_x1:
        _target_: contrib.SST.solver.GradSolver
        n_step: 20
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 34
          dim_hidden: 96
          dim_out: 5
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 5
          dim_hidden: 128
      solver_x3:
        _target_: contrib.SST.solver.GradSolver
        n_step: 15
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 76
          dim_hidden: 80
          dim_out: 9
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 9
          dim_hidden: 96
      solver_x10:
        _target_: contrib.SST.solver.GradSolver
        n_step: 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 124
          dim_hidden: 64
          dim_out: 15
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 15
          dim_hidden: 80
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  _target_: src.utils.get_linear_time_wei
  patch_dims: {time: 15, lat: 256, lon: 256}
  crop: {time: 0, lat: 28, lon: 28}
  offset: 1
  dim_order: ["time", "lat", "lon"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: /dcai/projects/cu_0026/results
    ckpt: null  # Can be overridden with +ckpt=/path/to/checkpoint.ckpt
    test: false
