# @package _global_
# Configuration LITE pour test DDP (4 GPUs)
paths:
  src: /dmidata/users/malegu/4D-MLG/Croscim
  preproc: /dmidata/users/malegu/data/preproc_SST
  outputs: /dmidata/projects/4dvarnet/outputs

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 4  # 4 GPUs (A40 en local)
  strategy: ddp_find_unused_parameters_true  # DDP avec find_unused_parameters=True (multi-résolution utilise des solvers différents par batch)
  accumulate_grad_batches: 2  # 4 GPUs × batch_size=4 × accumulate=2 = 32 effective batch
  limit_train_batches: 20
  limit_val_batches: 5
  max_epochs: 3
  precision: 32
  enable_progress_bar: true
  enable_model_summary: true
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: /dmidata/projects/4dvarnet/results_sst_multires
    name: run_ddp
    version: ${now:%Y%m%d_%H%M%S}
    default_hp_metric: false
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: /dmidata/projects/4dvarnet/checkpoints_sst_multires
      monitor: val/loss
      save_top_k: 3
      save_last: true
      filename: '{epoch:03d}-{val/loss:.5f}'
      mode: min

datamodule:
  _target_: contrib.SST.data_multires.BaseDataModuleMultiRes
  sst_daily_paths: /nwp/sst_malegu
  covariates_paths: []
  multires: [10, 3, 1]
  precomputed: True
  mask_path: null
  domain_name: sst_multires
  res: 5.0
  pads: [False, False, False]
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2024-01-01', '2024-08-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2024-09-01', '2024-10-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2024-11-01', '2024-12-31']}
  xrds_kw:
    patch_dims: {time: 15, lat: 256, lon: 256}
    strides: {time: 3, lat: 64, lon: 64}
    test_single_day: true
    test_date_idx: 15
  dl_kw:
    batch_size: 4  # Par GPU
    num_workers: 4  # 4 workers × 4 GPUs = 16 total
    persistent_workers: false  # DDP: false évite deadlock au fork
    prefetch_factor: 2
  tgt_vars: ["slstr_av", "aasti_av"]
  norm_stats:
    aasti:
      av: {mean: -7.228, std: 13.843, type: zscore}
      std: {mean: 0.479, std: 0.433, type: zscore}
    avhrr:
      av: {mean: 20.309, std: 8.798, type: zscore}
      std: {mean: 0.107, std: 0.072, type: zscore}
    pmw:
      av: {mean: 18.158, std: 9.656, type: zscore}
      std: {mean: 0.096, std: 0.064, type: zscore}
    slstr:
      av: {mean: 20.406, std: 9.136, type: zscore}
      std: {mean: 0.139, std: 0.129, type: zscore}
    tgt_sst: {mean: 11.683, std: 17.667, type: zscore}
  norm_stats_covs:
    sea_ice_fraction: {min: 0.0, max: 1.0, type: minmax}

model:
  _target_: contrib.SST.models.Lit4dVarNet_SST
  outputs_dir: ${paths.outputs}
  persist_rw: False
  multires: [10, 3, 1]
  opt_fn: null
  tgt_vars: ["tgt_sst"]
  norm_tgt_vars: ["slstr_av", "aasti_av"]
  domain_limits: null
  rec_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  optim_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  prior_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  frcst_lead: 0
  loss_weights:
    mse: 1.0      # Erreur prédiction vs observations
    grad: 0.001   # Erreur sur gradients Sobel (discontinuités)
    prior: 0.05   # Erreur target vs BilinReconstructor (régularisation)
  inpaint_weight_factor: 3.0  # Boost pour pixels masqués artificiellement
  solver:
    _target_: contrib.SST.solver.GradSolvers
    solvers:
      solver_x1:
        _target_: contrib.SST.solver.GradSolver
        n_step: 3
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 49
          dim_hidden: 32
          dim_out: 5
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 5
          dim_hidden: 32
      solver_x3:
        _target_: contrib.SST.solver.GradSolver
        n_step: 3
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 85
          dim_hidden: 32
          dim_out: 9
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 9
          dim_hidden: 32
      solver_x10:
        _target_: contrib.SST.solver.GradSolver
        n_step: 2
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 139
          dim_hidden: 32
          dim_out: 15
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 15
          dim_hidden: 32
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  _target_: src.utils.get_linear_time_wei
  patch_dims: {time: 15, lat: 256, lon: 256}
  crop: {time: 0, lat: 28, lon: 28}
  offset: 1
  dim_order: ["time", "lat", "lon"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: /dmidata/projects/4dvarnet/results_sst_multires
    test: false  # Test manuel avec ./run_test_checkpoint.sh <checkpoint> (évite deadlocks NCCL en DDP)
