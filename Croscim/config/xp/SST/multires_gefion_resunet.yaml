# @package _global_
# Configuration expérimentale Gefion ResUNet prior (1 node, 8 GPUs H100, DDP)

paths:
  src: /dcai/users/guimae/4dvarnet-mlg/Croscim
  preproc: null  # Non utilisé (precomputed=True)
  outputs: /dcai/projects/cu_0026/guimae/croscim/outputs

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 8  # Full Gefion node: 8 H100 GPUs
  strategy:
    _target_: pytorch_lightning.strategies.DDPStrategy
    find_unused_parameters: true
    # Note: static_graph désactivé car multi-résolution change le graphe
  accumulate_grad_batches: 2  # 8 GPUs × batch_size=5 × accumulate=2 = 80 effective batch
  # 500 batches donnent 250 updates/epoch avec plus de VRAM utilisée que batch_size=4,
  # sans pousser aussi près de l'OOM que batch_size=6.
  limit_train_batches: 500
  # NOTE: en DDP le set val (64 patchs) est shardé entre GPUs ; chaque GPU voit
  # ~ceil(64/(batch_size*world_size)) batches. Validation à reconfirmer après
  # diagnostic DDP (§1 todo).
  limit_val_batches: 13  # ceil((n_viz=16 + n_loss=48) / batch_size=5)
  max_epochs: 96              # 8 cycles de 12 epochs (divisible par 12)
  precision: bf16-mixed       # bfloat16 mixed precision - optimal pour H100
  enable_progress_bar: true
  enable_model_summary: true
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: /dcai/projects/cu_0026/guimae/croscim/results
    name: resunet_2017_2024
    version: ${now:%Y%m%d_%H%M%S}
    default_hp_metric: false
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: /dcai/projects/cu_0026/guimae/croscim/checkpoints/resunet_2017_2024
      monitor: val/loss
      save_top_k: 3
      save_last: true
      filename: '{epoch:03d}-{val/loss:.5f}'
      mode: min

datamodule:
  _target_: contrib.SST.data_multires.BaseDataModuleMultiRes
  sst_daily_paths: /dcai/projects/cu_0026/data_sst
  covariates_paths: []
  multires: [10, 3, 1]
  precomputed: True
  mask_path: null
  domain_name: sst_multires
  res: 5.0
  pads: [False, False, False]
  # Set de validation figé : 16 viz + 48 loss (cf multires.yaml).
  val_set_dir: ${paths.outputs}/val_set
  n_viz: 16
  n_loss: 48
  rebuild_val_set: false
  val_set_seed: 42
  val_set_max_scan: 2000
  val_candidate_budget: 400
  val_set_num_workers: 16
  patch_filter:
    train:    {min_valid_ratio: 0.02, min_variance: 0.05, min_ocean_ratio: 0.05}
    val_viz:  {min_valid_ratio: 0.50, min_variance: 0.30, min_ocean_ratio: 0.50}
    val_loss: {min_valid_ratio: 0.02, min_variance: 0.05, min_ocean_ratio: 0.05}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2017-01-01', '2024-09-30']}
    val:
      time: {_target_: builtins.slice, _args_: ['2024-10-01', '2024-11-30']}
    test:
      time: {_target_: builtins.slice, _args_: ['2024-12-01', '2024-12-31']}
  xrds_kw:
    patch_dims: {time: 15, lat: 256, lon: 256}
    strides: {time: 7, lat: 40, lon: 40}
    test_single_day: true
    test_date_idx: 15
    cover_edges: true
    min_spatial_overlap: 10
  dl_kw:
    batch_size: 5
    num_workers: 32           # Test throughput Gefion: 32 workers/GPU × 8 GPUs = 256 workers
    pin_memory: true
    persistent_workers: false # DDP: false évite deadlock au fork
    prefetch_factor: 2
  tgt_vars: ["slstr_av", "aasti_av"]
  norm_stats:
    aasti:
      av: {mean: 7.78095617993726, std: 20.58217902545633, type: zscore}
      std: {mean: 0.5077831826835209, std: 0.4390734832667238, type: zscore}
    avhrr:
      av: {mean: 7.78095617993726, std: 20.58217902545633, type: zscore}
      std: {mean: 0.0890857441102913, std: 0.0528907692517733, type: zscore}
    pmw:
      av: {mean: 7.78095617993726, std: 20.58217902545633, type: zscore}
      std: {mean: 0.09628680104895662, std: 0.0641033199869133, type: zscore}
    slstr:
      av: {mean: 7.78095617993726, std: 20.58217902545633, type: zscore}
      std: {mean: 0.13321845908682775, std: 0.1224908246943308, type: zscore}
    tgt_sst: {mean: 7.78095617993726, std: 20.58217902545633, type: zscore}
  norm_stats_covs:
    sea_ice_fraction: {min: 0.0, max: 1.0, type: minmax}

model:
  _target_: contrib.SST.models.Lit4dVarNet_SST
  outputs_dir: ${paths.outputs}
  persist_rw: False
  multires: [10, 3, 1]
  epochs_per_res_cycle: 4  # Cyclic training: 4 epochs per resolution (requires max_epochs divisible by 12)
  opt_fn: null
  tgt_vars: ["tgt_sst"]
  norm_tgt_vars: ["slstr_av", "aasti_av"]
  domain_limits: null
  rec_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  optim_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  prior_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  frcst_lead: 0
  loss_weights:
    mse: 1.0      # Erreur prédiction vs observations
    grad: 0.05    # Erreur sur gradients Sobel (discontinuités)
    prior: 0.2    # Régularisation via prior dynamique ResUNet
  inpaint_weight_factor: 1.0  # Boost pour pixels masqués artificiellement
  solver:
    _target_: contrib.SST.solver.GradSolvers
    solvers:
      solver_x1:
        _target_: contrib.SST.solver.GradSolver
        n_step: 20
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.model_components.priors.resunet.ResUNetPriorCost
          dim_in: 44
          dim_hidden: 80
          dim_out: 5
          depth: 3
          blocks_per_level: 1
          norm_groups: 8
          dropout: 0.0
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: contrib.SST.model_components.grad_mods.convlstm.ConvLstmGradModel
          dim_in: 5
          dim_hidden: 128
      solver_x3:
        _target_: contrib.SST.solver.GradSolver
        n_step: 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.model_components.priors.resunet.ResUNetPriorCost
          dim_in: 76
          dim_hidden: 64
          dim_out: 9
          depth: 3
          blocks_per_level: 1
          norm_groups: 8
          dropout: 0.0
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: contrib.SST.model_components.grad_mods.convlstm.ConvLstmGradModel
          dim_in: 9
          dim_hidden: 96
      solver_x10:
        _target_: contrib.SST.solver.GradSolver
        n_step: 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.model_components.priors.resunet.ResUNetPriorCost
          dim_in: 124
          dim_hidden: 48
          dim_out: 15
          depth: 3
          blocks_per_level: 1
          norm_groups: 8
          dropout: 0.0
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: contrib.SST.model_components.grad_mods.convlstm.ConvLstmGradModel
          dim_in: 15
          dim_hidden: 80
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  _target_: src.utils.get_linear_time_wei
  patch_dims: {time: 15, lat: 256, lon: 256}
  crop: {time: 0, lat: 0, lon: 0}
  offset: 1
  dim_order: ["time", "lat", "lon"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: /dcai/projects/cu_0026/guimae/croscim/results
    ckpt: null  # Can be overridden with +ckpt=/path/to/checkpoint.ckpt
    test: false  # Test manuel mono-GPU (évite deadlocks NCCL en DDP)
