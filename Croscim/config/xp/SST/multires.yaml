# @package _global_

paths:
  src: /dmidata/users/malegu/4D-MLG/Croscim
  preproc: /dmidata/users/malegu/data/preproc_SST
  outputs: /dmidata/projects/4dvarnet/outputs

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  # strategy: ddp
  accumulate_grad_batches: 5
  limit_train_batches: 150
  limit_val_batches: 16
  max_epochs: 84  # Divisible by 12 for multi-res cyclic training
  precision: bf16-mixed  # bfloat16 mixed precision - faster training, less memory
  enable_progress_bar: true
  enable_model_summary: true
  num_sanity_val_steps: 4
  log_every_n_steps: 1
  logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: /dmidata/projects/4dvarnet/results_sst_multires
    name: run
    version: ${now:%Y%m%d_%H%M%S}  # Format: 20251119_153042
    default_hp_metric: false
  callbacks:
    # - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: /dmidata/projects/4dvarnet/checkpoints_sst_multires
      monitor: val/loss
      save_top_k: 5  # Garde les 5 meilleurs modèles
      save_last: true  # Sauvegarde aussi le dernier checkpoint
      filename: '{epoch:03d}-{val/loss:.5f}'
      mode: min

datamodule:
  _target_: contrib.SST.data_multires.BaseDataModuleMultiRes
  sst_daily_paths: /nwp/sst_malegu
  covariates_paths: []
  multires: [10, 3, 1]
  precomputed: True
  mask_path: null
  domain_name: sst_multires
  res: 5.0
  pads: [False, False, False]
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2022-01-01', '2023-12-31']}  # 2022-2023 (2 ans)
    val:
      time: {_target_: builtins.slice, _args_: ['2024-01-01', '2024-06-30']}  # 2024 premier semestre
    test:
      time: {_target_: builtins.slice, _args_: ['2024-07-01', '2024-12-31']}  # 2024 second semestre
  xrds_kw:
    patch_dims: {time: 15, lat: 256, lon: 256}
    strides: {time: 7, lat: 64, lon: 64}  # Strides for training (not used in test)
    strides_by_res:  # Strides per resolution for test mode
      10: {time: 15, lat: 52, lon: 154}  # 3x4 = 12 patches, full globe coverage
      3: {time: 9, lat: 200, lon: 200}   # 6x12 = 72 patches
      1: {time: 5, lat: 200, lon: 200}   # 18x36 = 648 patches
    test_single_day: true
    test_date_idx: 15
  dl_kw:
    batch_size: 3
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  tgt_vars: ["slstr_av", "aasti_av"]
  norm_stats:
    aasti:
      av: {mean: -6.732, std: 13.734, type: zscore}
      std: {mean: 0.45, std: 0.438, type: zscore}
    avhrr:
      av: {mean: 20.34, std: 8.778, type: zscore}
      std: {mean: 0.108, std: 0.068, type: zscore}
    pmw:
      av: {mean: 18.147, std: 9.644, type: zscore}
      std: {mean: 0.094, std: 0.064, type: zscore}
    slstr:
      av: {mean: 20.429, std: 9.114, type: zscore}
      std: {mean: 0.13, std: 0.126, type: zscore}
    tgt_sst: {mean: 11.683, std: 17.667, type: zscore}
  norm_stats_covs:
    sea_ice_fraction: {min: 0.0, max: 1.0, type: minmax}

model:
  _target_: contrib.SST.models.Lit4dVarNet_SST
  outputs_dir: ${paths.outputs}
  persist_rw: False
  multires: [10, 3, 1]
  epochs_per_res_cycle: 4  # Cyclic training: 4 epochs per resolution (requires max_epochs divisible by 12)
  opt_fn: null
  tgt_vars: ["tgt_sst"]
  norm_tgt_vars: ["slstr_av", "aasti_av"]
  domain_limits: null
  rec_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  optim_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  prior_weight:
    patch_x1: ${optim_weight}
    patch_x3: ${optim_weight}
    patch_x10: ${optim_weight}
  frcst_lead: 0
  loss_weights:
    mse: 1.0      # Erreur prédiction vs observations
    grad: 0.05   # Erreur sur gradients Sobel (discontinuités)
    prior: 0.2   # Erreur target vs BilinReconstructor (régularisation)
  inpaint_weight_factor: 1.0  # Boost pour pixels masqués artificiellement
  solver:
    _target_: contrib.SST.solver.GradSolvers
    solvers:
      solver_x1:
        _target_: contrib.SST.solver.GradSolver
        n_step: 20
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 44
          dim_hidden: 96
          dim_out: 5
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 5
          dim_hidden: 128
      solver_x3:
        _target_: contrib.SST.solver.GradSolver
        n_step: 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 76
          dim_hidden: 80
          dim_out: 9
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 9
          dim_hidden: 96
      solver_x10:
        _target_: contrib.SST.solver.GradSolver
        n_step: 10
        lr_grad: 1e-3
        prior_cost:
          _target_: contrib.SST.solver.BilinReconstructorPriorCost
          dim_in: 124
          dim_hidden: 64
          dim_out: 15
          bilin_quad: False
          downsamp: 2
        obs_cost: {_target_: contrib.SST.solver.BaseObsCost}
        grad_mod:
          _target_: src.models.ConvLstmGradModel
          dim_in: 15
          dim_hidden: 80
  norm_stats: ${datamodule.norm_stats}
  norm_stats_covs: ${datamodule.norm_stats_covs}

optim_weight:
  _target_: src.utils.get_linear_time_wei
  patch_dims: {time: 15, lat: 256, lon: 256}
  crop: {time: 0, lat: 0, lon: 0}
  offset: 1
  dim_order: ["time", "lat", "lon"]

metrics:
  nrmse_scores: {_target_: src.utils.rmse_based_scores_from_ds, _partial_: True}
  psd_scores: {_target_: src.utils.psd_based_scores_from_ds, _partial_: True}
  get0: {_target_: operator.itemgetter, _args_: [0]}
  get1: {_target_: operator.itemgetter, _args_: [1]}
  test_metrics:
    mu: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get0}']}
    sig: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.nrmse_scores}', '${metrics.get1}']}
    lx: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get0}']}
    lt: {_target_: src.utils.pipe, _partial_: true, fns: ['${metrics.psd_scores}', '${metrics.get1}']}

entrypoints:
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    save_dir: /dmidata/users/malegu/results
    ckpt: null  # Can be overridden with +ckpt=/path/to/checkpoint.ckpt
    test: false  # Test manuel avec ./run_test_checkpoint.sh
